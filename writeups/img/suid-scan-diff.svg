  <text x="460" y="22" fill="#8b949e" text-anchor="middle" font-size="12">linux-vulnscan.sh — SUID section · scan diff before/after chmod u-s</text>

  <text x="24" y="64" font-size="13" fill="#8b949e">=== SUID / WRITABLE ===                       (scan 2026-11-13 · BEFORE)</text>
  <text x="24" y="83" font-size="13" fill="#f85149" font-weight="bold">  [!!] SUID: /usr/sbin/mount.nfs (GTFOBins root-escalation risk)</text>
  <text x="24" y="102" font-size="13" fill="#f85149" font-weight="bold">  [!!] SUID: /usr/lib/polkit-1/polkit-agent-helper-1 (GTFOBins root-escalation risk)</text>
  <text x="24" y="121" font-size="13" fill="#f85149" font-weight="bold">  [!!] SUID: /usr/bin/find (GTFOBins root-escalation risk)</text>
  <text x="24" y="140" font-size="13" fill="#e6edf3">     /usr/bin/passwd · /usr/bin/sudo · /usr/bin/su · ... (stock Ubuntu)</text>

  <text x="24" y="171" font-size="13"><tspan fill="#3fb950" font-weight="bold">blueteam@ip-10-0-186-144</tspan><tspan fill="#79c0ff">:~$ </tspan><tspan fill="#e6edf3">sudo chmod u-s /usr/bin/find /usr/sbin/mount.nfs \</tspan></text>
  <text x="120" y="190" font-size="13" fill="#e6edf3">/usr/lib/polkit-1/polkit-agent-helper-1</text>
  <text x="24" y="209" font-size="13"><tspan fill="#3fb950" font-weight="bold">blueteam@ip-10-0-186-144</tspan><tspan fill="#79c0ff">:~$ </tspan><tspan fill="#e6edf3">ls -l /usr/bin/find</tspan></text>
  <text x="24" y="228" font-size="13" fill="#e6edf3">-rwxr-xr-x 1 root root ... /usr/bin/find        <tspan fill="#8b949e"># 's' bit gone (was -rwsr-xr-x)</tspan></text>

  <text x="24" y="259" font-size="13" fill="#8b949e">=== SUID / WRITABLE ===                       (rescan · AFTER)</text>
  <text x="24" y="278" font-size="13" fill="#e6edf3">     /usr/lib/openssh/ssh-keysign · /usr/bin/passwd · /usr/bin/sudo · /usr/bin/su ...</text>
  <text x="24" y="297" font-size="13" fill="#3fb950" font-weight="bold">  [0] non-standard SUID binaries remaining — all flagged [!!] cleared</text>

