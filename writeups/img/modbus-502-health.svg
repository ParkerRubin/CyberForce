<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" font-family="'Cascadia Code','Consolas',monospace">
  <rect width="920" height="330" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect width="920" height="34" rx="10" fill="#161b22"/>
