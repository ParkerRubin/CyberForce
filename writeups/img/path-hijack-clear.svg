<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" font-family="'Cascadia Code','Consolas',monospace">
  <rect width="920" height="300" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect width="920" height="34" rx="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="40" cy="17" r="5.5" fill="#febc2e"/><circle cx="60" cy="17" r="5.5" fill="#28c840"/>
  <text x="460" y="22" fill="#8b949e" text-anchor="middle" font-size="12">F10 — "PATH hijack" flags · one permission check clears four findings</text>

  <text x="24" y="66" font-size="13"><tspan fill="#3fb950" font-weight="bold">blueteam@ip-10-0-186-144</tspan><tspan fill="#79c0ff">:~$ </tspan><tspan fill="#e6edf3">ls -l /usr/local/bin/cmake /usr/local/bin/python3</tspan></text>
  <text x="24" y="85" font-size="13" fill="#e6edf3">-rwxr-xr-x 1 root root 17241856 Jul  1 12:00 /usr/local/bin/cmake</text>
  <text x="24" y="104" font-size="13" fill="#e6edf3">-rwxr-xr-x 1 root root  8020928 Aug 14 21:45 /usr/local/bin/python3</text>

  <text x="24" y="133" font-size="13"><tspan fill="#3fb950" font-weight="bold">blueteam@ip-10-0-186-144</tspan><tspan fill="#79c0ff">:~$ </tspan><tspan fill="#e6edf3">ls -ld /usr/local/bin</tspan></text>
  <text x="24" y="152" font-size="13" fill="#e6edf3">drwxr-xr-x 2 root root 4096 Oct 21 14:52 /usr/local/bin</text>

  <text x="24" y="183" font-size="13" fill="#3fb950" font-weight="bold">[OK] owner root:root · dir mode 755 → non-root users CANNOT plant shadowing binaries</text>
  <text x="24" y="202" font-size="13" fill="#3fb950" font-weight="bold">[OK] file dates pre-date team access (image build artifacts) → not planted during comp</text>

  <text x="24" y="233" font-size="13" fill="#8b949e"># the logic: shadowing only matters if someone can WRITE to the earlier PATH directory.</text>
  <text x="24" y="252" font-size="13" fill="#8b949e"># delivery path closed → 4x [CRIT] flags demoted to noise · cmake/cpack/ctest = one installer suite</text>
  <text x="24" y="281" font-size="13" fill="#8b949e"># SecDoc: "checked and cleared" entry — systematic triage beats noise-firing</text>
</svg>
